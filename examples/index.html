<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>luci-plot example</title>

    <link rel="stylesheet" href="../luci-plot.css">

    <style>
        body {
            margin: 24px;
            font-family: sans-serif;
        }

        .plot-container {
            width: 100%;
            max-width: 800px;
        }

        pre {
            max-width: 800px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<h1>luci-plot example</h1>

<p>
    Declarative JSON-compatible configuration with a time axis,
    two independent Y axes, fixed axis limits and missing values.
</p>

<div id="plot" class="plot-container"></div>

<h2>Configuration</h2>

<pre id="config"></pre>

<script src="../luci-plot.js"></script>

<script>
'use strict';

const spec = {
    plot: {
        x: {
            key: 'time',
            type: 'time',
            label: 'Time',
            format: 'time'
        },

        axes: {
            temperature: {
                position: 'left',
                unit: '°C',
                min: 15,
                max: 30
            },

            humidity: {
                position: 'right',
                unit: '%',
                min: 0,
                max: 100
            }
        },

        series: [
            {
                key: 'temperature',
                label: 'Temperature',
                axis: 'temperature',
                format: 'number',
                digits: 1
            },

            {
                key: 'humidity',
                label: 'Humidity',
                axis: 'humidity',
                format: 'integer'
            }
        ]
    },

    data: [
        {
            time: 1788498000,
            temperature: 20.1,
            humidity: 62
        },
        {
            time: 1788498060,
            temperature: 21.4,
            humidity: 59
        },
        {
            time: 1788498180,
            temperature: 22.8,
            humidity: 56
        },
        {
            time: 1788498240,
            temperature: null,
            humidity: 54
        },
        {
            time: 1788498360,
            temperature: 24.6,
            humidity: 51
        },
        {
            time: 1788498420,
            temperature: 23.9,
            humidity: 53
        },
        {
            time: 1788498600,
            temperature: 22.2,
            humidity: 57
        }
    ]
};

LuciPlot.render('#plot', spec);

document.getElementById('config').textContent =
    JSON.stringify(spec, null, 4);
</script>

</body>
</html>
